<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Live Clock</title>
<style>
  :root {
    --bg: #FFFFFF;
    --fg: #1A1A1A;
    --accent: #E03131;
    --muted: #6B6B6B;
    --track: #ECECEC;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .clock-wrap {
    text-align: center;
    padding: 8px 16px;
    width: 100%;
    max-width: 320px;
  }
  .greeting {
    font-size: clamp(0.8rem, 2vw, 0.95rem);
    color: var(--muted);
    margin-bottom: 2px;
    letter-spacing: 0.02em;
  }
  .time {
    font-size: clamp(2rem, 7vw, 3.4rem);
    font-weight: 600;
    letter-spacing: 0.02em;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .time .secs {
    color: var(--accent);
  }
  .date {
    margin-top: 2px;
    font-size: clamp(0.8rem, 2.2vw, 1rem);
    color: var(--accent);
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .progress-row {
    margin-top: 10px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .progress-track {
    flex: 1;
    height: 5px;
    border-radius: 4px;
    background: var(--track);
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: var(--accent);
    border-radius: 4px;
    transition: width 1s linear;
  }
  .progress-label {
    font-size: 0.7rem;
    color: var(--muted);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .info-row {
    margin-top: 8px;
    display: flex;
    justify-content: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  .info-chip {
    font-size: 0.75rem;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .info-chip strong {
    color: var(--fg);
    font-weight: 600;
  }
</style>
</head>
<body>
  <div class="clock-wrap">
    <div class="greeting" id="greeting">Loading…</div>
    <div class="time" id="time">--:--:--</div>
    <div class="date" id="date">Loading…</div>
    <div class="progress-row">
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="progress-label" id="progressLabel">0%</div>
    </div>
    <div class="info-row">
      <div class="info-chip" id="weatherChip">⛅ Loading weather…</div>
      <div class="info-chip" id="countdownChip"></div>
    </div>
  </div>

  <script>
    function pad(n) { return n.toString().padStart(2, "0"); }

    function update() {
      const now = new Date();

      document.getElementById("time").innerHTML =
        `${pad(now.getHours())}:${pad(now.getMinutes())}<span class="secs">:${pad(now.getSeconds())}</span>`;

      const hour = now.getHours();
      let greeting;
      if (hour < 5) greeting = "Still up, night owl";
      else if (hour < 12) greeting = "Good morning";
      else if (hour < 17) greeting = "Good afternoon";
      else if (hour < 21) greeting = "Good evening";
      else greeting = "Winding down";
      document.getElementById("greeting").textContent = greeting;

      const days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
      const months = ["January","February","March","April","May","June","July","August","September","October","November","December"];

      document.getElementById("date").textContent =
        `${days[now.getDay()]}, ${months[now.getMonth()]} ${now.getDate()}, ${now.getFullYear()}`;

      const secondsSinceMidnight =
        now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
      const percentOfDay = (secondsSinceMidnight / 86400) * 100;

      document.getElementById("progressFill").style.width = percentOfDay + "%";
      document.getElementById("progressLabel").textContent = Math.floor(percentOfDay) + "%";
    }

    update();
    setInterval(update, 1000);

    // ---- CONFIG: edit these two lines for your setup ----
    const LATITUDE = 55.9533;   // Edinburgh
    const LONGITUDE = -3.1883;
    const TARGET_DATE = "2026-10-14"; // countdown target, e.g. a project end date
    const TARGET_LABEL = "Wester Hailes deadline";
    // -------------------------------------------------------

    function weatherDescription(code) {
      if (code === 0) return "☀️ Clear";
      if ([1, 2, 3].includes(code)) return "⛅ Partly cloudy";
      if ([45, 48].includes(code)) return "🌫️ Fog";
      if ([51, 53, 55, 56, 57].includes(code)) return "🌦️ Drizzle";
      if ([61, 63, 65, 66, 67, 80, 81, 82].includes(code)) return "🌧️ Rain";
      if ([71, 73, 75, 77, 85, 86].includes(code)) return "❄️ Snow";
      if ([95, 96, 99].includes(code)) return "⛈️ Storm";
      return "🌡️ Mixed";
    }

    async function loadWeather() {
      try {
        const res = await fetch(
          `https://api.open-meteo.com/v1/forecast?latitude=${LATITUDE}&longitude=${LONGITUDE}&current=temperature_2m,weather_code`
        );
        const data = await res.json();
        const temp = Math.round(data.current.temperature_2m);
        const desc = weatherDescription(data.current.weather_code);
        document.getElementById("weatherChip").innerHTML = `${desc} <strong>${temp}°C</strong>`;
      } catch (e) {
        document.getElementById("weatherChip").textContent = "Weather unavailable";
      }
    }

    function updateCountdown() {
      const now = new Date();
      const target = new Date(TARGET_DATE + "T00:00:00");
      const diffDays = Math.ceil((target - now) / 86400000);
      const chip = document.getElementById("countdownChip");
      if (diffDays > 0) {
        chip.innerHTML = `📅 <strong>${diffDays}d</strong> until ${TARGET_LABEL}`;
      } else if (diffDays === 0) {
        chip.innerHTML = `📅 <strong>${TARGET_LABEL}</strong> is today`;
      } else {
        chip.innerHTML = `📅 ${TARGET_LABEL} passed`;
      }
    }

    loadWeather();
    setInterval(loadWeather, 15 * 60 * 1000); // refresh weather every 15 min
    updateCountdown();
    setInterval(updateCountdown, 60 * 1000); // refresh countdown every minute
  </script>
</body>
</html>
